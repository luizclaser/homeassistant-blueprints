blueprint:
  name: "Iluminação Noturna - Múltiplos Sensores, Lâmpadas e Horário Flexível"
  description: "Liga uma ou mais luzes/interruptores quando qualquer um dos sensores de porta ou movimento selecionados for acionado dentro do intervalo de horário permitido, e desliga após o tempo configurado em minutos."
  domain: automation
  source_url: https://github.com/luizclaser/homeassistant-blueprints/blob/main/iluminacao_noturna.yaml
  input:
    nome_automacao:
      name: Nome da Automação
      description: Defina o nome personalizado para esta automação.
      default: "Iluminação Noturna por Presença"
      selector:
        text: {}

    icone_automacao:
      name: Ícone / Caractere Distintivo
      description: Escolha um ícone MDI para identificar e distinguir esta automação na lista (exemplo mdi:weather-night, mdi:lightbulb, mdi:door).
      default: "mdi:weather-night"
      selector:
        icon: {}

    sensores_movimento:
      name: Sensores de Movimento / Presença (Opcional)
      description: Selecione um ou mais sensores de movimento ou presença.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true

    sensores_porta:
      name: Sensores de Porta / Abertura (Opcional)
      description: Selecione um ou mais sensores de porta ou janela.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: door
          multiple: true

    dispositivos_alvo:
      name: Interruptores / Lâmpadas
      description: Selecione todas as luzes ou interruptores que serão ligados.
      selector:
        target:
          entity:
            domain:
              - switch
              - light

    horario_inicio:
      name: Horário de Início
      description: Horário a partir do qual a automação passa a funcionar.
      default: "22:00:00"
      selector:
        time: {}

    horario_fim:
      name: Horário de Término
      description: Horário até o qual a automação deve funcionar.
      default: "06:00:00"
      selector:
        time: {}

    tempo_desligar:
      name: Tempo para Desligar (Minutos)
      description: Quanto tempo as lâmpadas permanecerão ligadas após serem acionadas.
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: "minutos"

mode: restart

trigger:
  - platform: state
    entity_id: !input sensores_porta
    to: "on"
  - platform: state
    entity_id: !input sensores_movimento
    to: "on"

condition:
  - condition: time
    after: !input horario_inicio
    before: !input horario_fim

action:
  - action: homeassistant.turn_on
    target: !input dispositivos_alvo
  - delay:
      minutes: !input tempo_desligar
  - action: homeassistant.turn_off
    target: !input dispositivos_alvo
